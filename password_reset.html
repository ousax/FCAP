<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reintilaiser votre mot mot de passe - FCA Shop</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
</head>
<style>
  body{
    background-image: url("pexels-iriser-1366957.jpg");
    background-size: cover;
  }
</style>
<body class="login-page">
  <div class="login-container">
    <h1>FCA Shop Login</h1>
    <form id="loginForm">
      <input id="username" type="email" placeholder="email@fcasupport.com" required />
      <button type="submit" onclick="checkMe()">Reinitialiser</button><br>
      <a href="index.html">Acceuil</a>
    </form>
    
    <p id="loginMessage"></p>
  </div>
<script>
  let form = document.getElementById("loginForm");
 
  function checkMe(){
    const message = document.getElementById('loginMessage');
    let email = document.getElementById("username").value;
    if(email){
      alert("Les instructions sont envoyées veuillez vérifier votre addresse email" +email);
      document.location.href = "index.html";
    }
    else{
      message.textContent = 'L\'adresse email saisie n\'est pas valide';
      message.style.color = 'red';
    }
  }
</script>
</body>
</html>
