<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Se connecter - FCA Shop</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
</head>
<style>
  body{
    background-image: url("pexels-iriser-1366957.jpg");
    background-size: cover;
  }
</style>
<body class="login-page">
  <div class="login-container">
    <h1>FCA Shop Login</h1>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Email ou Utilisateur" required />
      <input type="password" id="password" placeholder="###############" required />
      <button type="submit">Login</button>
      <p><a href="#" id="resetPassword">Mot de passe oublié?</a></p>
      <p><a href="create_account.html">Vous n'avez pas encore un compte ?</a></p>
    </form>
    <p id="loginMessage"></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('loginForm');
    const resetLink = document.getElementById('resetPassword');
    const message = document.getElementById('loginMessage');
  
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let username = document.getElementById('username').value;
        let password = document.getElementById('password').value;

        if (username === 'FCAdmin' && password === 'oualidfca') {
          window.location.href = 'home.html';
        } else {
          message.textContent = 'Le mot de passe saisi est incorrect';
          message.style.color = 'red';
        }
      });
    }
  
    if (resetLink) {
      resetLink.addEventListener('click', (e) => {
        e.preventDefault();
        alert('Veuillez rensigner votre email addresse');
        window.location.href = 'password_reset.html';
      });
    }
  });
  </script>
</body>
</html>
